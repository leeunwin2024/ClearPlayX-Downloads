name: Publish ClearPlayX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK
        run: |
          curl --fail --location --retry 3 \
            --output ClearPlayX-0.14.0-logo-dashboard.apk \
            "https://tmpfiles.org/dl/1792409185.e75f2ebf7f2c8b35/wuAtnggKEVET/clearplayx-0.14.0-logo-dashboard.apk"
          echo "111a5b9523f92fc229d489ff6d324ebc3af9971a657c3a07484dda44c284f880  ClearPlayX-0.14.0-logo-dashboard.apk" | sha256sum --check -
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.14.0 \
            ClearPlayX-0.14.0-logo-dashboard.apk \
            --repo leeunwin2024/ClearPlayX-Downloads \
            --title "ClearPlayX 0.14.0" \
            --notes "ClearPlayX 0.14.0 for Android TV, Fire TV and Android. Includes the updated black-and-gold dashboard branding."
